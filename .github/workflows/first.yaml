on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  Node_version: 21.1
  appDirectory: ./react-app
  IMAGE_NAME: react-app

jobs:
  build:
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{env.Node_version}}
          cache: 'npm'
          cache-dependency-path: ${{env.appDirectory}}/package-lock.json

      - name: install dependencies
        working-directory: ${{ env.appDirectory }}
        run: npm install

      - name: build app
        working-directory: ${{ env.appDirectory }}
        run: npm run build


  docker-build:

     needs: build
     runs-on: ubuntu-latest
     environment: username

     steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{env.Node_version}}
          cache: npm
          cache-dependency-path: ${{env.appDirectory}}/package-lock.json

      - name: install dependencies
        working-directory: ${{env.appDirectory}}
        run: npm install

      - name: app-build
        working-directory: ${{ env.appDirectory }}
        run: npm run build

      - name: docker-login
        uses: docker/login-action@v4
        with:
          username: ${{vars.USER}}
          password: ${{secrets.PASSWORD}}

      - name: docker-push
        run: |
          docker build -t ${{ vars.USER }}/${{ env.IMAGE_NAME }}:latest ${{ env.appDirectory }}
          docker push ${{ vars.USER }}/${{ env.IMAGE_NAME }}:latest
