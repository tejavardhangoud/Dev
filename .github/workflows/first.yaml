on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  a: 1

jobs:
  build:
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
       os: [ubuntu-latest,windows-latest]
       node: [16,18,20]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        run: echo ${{ env.a }}

      - name: branch name
        run: echo ${{ github.ref }}

      - name: ref name
        run: echo ${{ github.ref_name }}

      - name: sha
        run: echo ${{ github.sha }}

      - name: event name
        run: echo ${{ github.event_name }}

      - name: actor
        run: echo ${{ github.actor }}

  buildone:
    runs-on: 
    strategy:
      matrix:
        os:[windows-latest]
        node:[16]
    steps:
      - run: echo ${{ env.a }}
